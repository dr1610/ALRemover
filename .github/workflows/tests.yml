name: Unit tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install image operation test dependencies
        run: python -m pip install "numpy>=2,<3" "Pillow>=11,<13" "opencv-python-headless>=4.10,<6"
      - name: Test alpha, brushes, ownership and project round trips
        run: python -m unittest discover -s tests -p "test_*.py"
